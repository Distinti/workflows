name: lint

permissions:
  id-token: write
  contents: read

on:
  - pull_request

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check formatting
        run: npx --yes prettier@3.6.2 --check .
